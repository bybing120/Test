
<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <title>Unity Web Player | Welcome to the Bakery (Quick Math)</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, user-scalable=no">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #d9f3f7;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #unity-canvas {
            display: block;
            width: min(960px, 100vw);
            height: auto;
            aspect-ratio: 16 / 9;
            background: #231F20;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        /* หน้าจอแนวตั้งหรืออุปกรณ์มือถือ */
        @media (max-aspect-ratio: 16/9) {
            #unity-canvas {
                width: 100vw;
                max-height: 100vh;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>

    <canvas id="unity-canvas"
            width="1920"
            height="1080"
            tabindex="-1">
    </canvas>

    <script src="Build/Web.loader.js"></script>

    <script>
        const canvas = document.querySelector("#unity-canvas");

        createUnityInstance(canvas, {
            arguments: [],
            dataUrl: "Build/Web.data.br",
            frameworkUrl: "Build/Web.framework.js.br",
            codeUrl: "Build/Web.wasm.br",
            streamingAssetsUrl: "StreamingAssets",

            companyName: "DefaultCompany",
            productName: "Welcome to the Bakery (Quick Math)",
            productVersion: "1.0",

            matchWebGLToCanvasSize: true,
            devicePixelRatio: 1

        }).then((unityInstance) => {

            console.log("Unity WebGL โหลดสำเร็จ!");

        }).catch((message) => {

            console.error("Unity WebGL Error:", message);
            alert("ไม่สามารถโหลดเกมได้:\n" + message);

        });
    </script>

</body>
</html>
